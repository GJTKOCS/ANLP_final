[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "covert"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "peft", "accelerate", "pyyaml", "numpy", "pandas", "matplotlib", "tqdm", "pytest"]
[project.scripts]
covert = "covert.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
